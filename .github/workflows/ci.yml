
name: Generic API Test Automation Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule: # Set teh CRON for MIDNIGHT IST --- by defaukt in UTC Time
    - cron: "30 18 * * *"
    
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa,uat,dev]
        default: qa
        required: true
      suiteXmlFile:
        description: "TestNG XML File"
        type: choice
        options: [testng.xml,smoke.xml,regression.xml,testng-datadriven.xml]
        default: testng.xml
        required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Creating the .env file
      run: |
            echo "ADMIN_API_USERNAME=${{ secrets.ADMIN_API_USERNAME }}" >> .env
            echo "ADMIN_API_PASSWORD=${{ secrets.ADMIN_API_PASSWORD }}" >> .env
            echo "USER_API_USERNAME=${{ secrets.USER_API_USERNAME }}" >> .env
            echo "USER_API_PASSWORD=${{ secrets.USER_API_PASSWORD }}" >> .env
            echo "GUEST_API_USERNAME=${{ secrets.GUEST_API_USERNAME }}" >> .env
            echo "GUEST_API_PASSWORD=${{ secrets.GUEST_API_PASSWORD }}" >> .env
        

    - name: Default Values for Execution
      id: default
      run: |
            echo "suiteXmlFile=${{ github.event.inputs.suiteXmlFile || 'testng.xml' }}" >> $GITHUB_OUTPUT
            echo "env=${{ github.event.inputs.env || 'qa' }}" >> $GITHUB_OUTPUT
        
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile="${{ steps.default.outputs.suiteXmlFile }}" -Denv="${{ steps.default.outputs.env }}"
      
    - name: Upload a Test Artifact
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: SureFire Report
        path: target/surefire-reports/
        retention-days: 10
      
