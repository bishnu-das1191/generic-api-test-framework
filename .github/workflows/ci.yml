
name: Generic API Test Automation Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile=testng.xml -Denv=qa
      
    - name: Upload a Test Artifact
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: SureFire Report
        path: target/surefire-reports/
        retention-days: 10
      
