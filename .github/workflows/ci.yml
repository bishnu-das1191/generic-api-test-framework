
name: Generic API Test Automation Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule: # Set teh CRON for MIDNIGHT IST --- by defaukt in UTC Time
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa,uat,dev]
        default: qa
        required: true
      suiteXmlFile:
        description: "TestNG XML File"
        type: choice
        options: [testng.xml,smoke.xml,regression.xml,testng-datadriven.xml]
        default: testng.xml
        required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXmlFile={{ github.event.inputs.suiteXmlFile }} -Denv={{ github.event.inputs.env }}
      
    - name: Upload a Test Artifact
      if: always()
      uses: actions/upload-artifact@v6.0.0
      with:
        name: SureFire Report
        path: target/surefire-reports/
        retention-days: 10
      
